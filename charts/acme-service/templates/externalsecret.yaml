{{- if or (.Values.secrets) (.Values.secretsAdditional) -}}
apiVersion: 'kubernetes-client.io/v1'
kind: ExternalSecret
metadata:
  name: {{ .Release.Name }}-secrets
spec:
  backendType: systemManager
  data:
    {{- range .Values.secrets }}
    - name: {{ . }}
      key: {{ default (printf "/acme-services/%s/%s/%s" $.Values.clusterVersion $.Release.Name $.Values.environment) $.Values.secretPathPrefix }}/{{ . }}
    {{- end }}

    {{- with .Values.secretsAdditional }}
      {{- toYaml . | nindent 4 }}
    {{- end }}
{{- end -}}
