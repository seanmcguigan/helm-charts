{{- if .Values.createK8sService }}
apiVersion: v1
kind: Service
metadata:
  name: {{ .Release.Name }}
  labels:
    {{- include "acme-service.labels" . | nindent 4 }}
spec:
  ports:
  {{- range .Values.ports }}
    - name: "{{ .protocolName | lower }}-{{ .name }}"
      port: {{ .containerPort }}
      targetPort: {{ .containerPort }}
      protocol: {{ .protocol }}
  {{- end }}
  selector:
    {{- include "acme-service.selectorLabels" . | nindent 4 }}
{{- end }}
